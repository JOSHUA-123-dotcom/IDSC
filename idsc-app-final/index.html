<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infotech Development System College</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Icon sprite: icons are used anywhere with <svg class="icon"><use href="#i-NAME"/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
      <symbol id="i-cap" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></symbol>
      <symbol id="i-dollar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9.5c0-1.4-1.3-2.5-3-2.5s-3 1-3 2.3c0 3 6 1.7 6 4.7 0 1.3-1.3 2.5-3 2.5s-3-1.100-3-2.500M12 5.500V7M12 17v1.500"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.200l7.800-7.700 1-1.100a5.500 5.500 0 0 0 0-7.800z"/></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.700l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.700l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.300 7 8.700 5 8.700-5M12 22V12"/></symbol>
      <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20c1.100 0 2-.900 2-2 0-.500-.200-1-.500-1.300-.300-.400-.500-.800-.500-1.300 0-1.100.900-2 2-2h2.400a4.600 4.600 0 0 0 4.600-4.600C22 6 17.500 2 12 2z"/><circle cx="7.500" cy="11" r="1"/><circle cx="12" cy="7" r="1"/><circle cx="16.500" cy="11" r="1"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-user-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M6.2 18.6a8 8 0 0 1 11.6 0"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H7a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V8z"/><path d="M14 2v6h6"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.700 3.900a2 2 0 0 0-3.400 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
      <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m8 12.500 3 3 5-6"/></symbol>
      <symbol id="i-alert-square" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v5M12 16.500h.01"/></symbol>
      <symbol id="i-spinner" viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.900 4.900l2.800 2.800M16.300 16.300l2.800 2.800M2 12h4M18 12h4M4.900 19.100l2.800-2.800M16.300 7.700l2.800-2.800"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">

    <header class="topbar" id="topbar">
      <a class="brand" href="#/home" aria-label="Go to home">
        <span class="logo"><b>IDSC</b><img src="images/logo.png" alt="" onerror="this.remove()"></span>
        <span class="brand-name">Infotech<br>Development System<br>College</span>
      </a>
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
        <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
    </header>

    <div class="scrim" id="scrim"></div>

    <nav class="drawer" id="drawer" aria-label="Main menu" aria-hidden="true" inert>
      <div class="drawer-head">
        <span class="brand">
          <span class="logo"><b>IDSC</b><img src="images/logo.png" alt="" onerror="this.remove()"></span>
          <span class="brand-name">Infotech<br>Development System<br>College</span>
        </span>
        <button class="icon-btn" id="closeBtn" type="button" aria-label="Close menu">
          <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </div>
      <ul class="drawer-links">
        <li><a href="#/home" data-nav="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>Home</a></li>
        <li><a href="#/modules" data-nav="modules"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>Modules</a></li>
        <li><a href="#/announcements" data-nav="announcements"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg>Announcement</a></li>
        <li><a href="#/about" data-nav="about"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>About</a></li>
        <li><a href="#/settings" data-nav="settings"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg>Settings</a></li>
      </ul>
    </nav>

    <!-- DESKTOP ONLY (hidden on phones): sidebar + top bar -->
    <aside class="sidebar" aria-label="Main navigation">
      <a class="side-brand" href="#/home" aria-label="Go to home">
        <span class="logo logo-lg"><b>IDSC</b><img src="images/logo.png" alt="" onerror="this.remove()"></span>
        <span class="brand-name">Infotech<br>Development<br>System<br>College</span>
      </a>
      <ul class="side-links">
        <li><a href="#/home" data-nav="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>Home</a></li>
        <li><a href="#/modules" data-nav="modules"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>Modules</a></li>
        <li><a href="#/announcements" data-nav="announcements"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg>Announcement</a></li>
        <li><a href="#/about" data-nav="about"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>About</a></li>
        <li><a href="#/settings" data-nav="settings"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg>Settings</a></li>
      </ul>
    </aside>

    <div class="deskbar">
      <form class="desk-search" id="deskSearch" role="search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="deskSearchInput" type="search" placeholder="Search something..." aria-label="Search announcements" autocomplete="off">
      </form>
      <button class="icon-btn bell" id="bellBtn" type="button" aria-label="Notifications">
        <svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg>
      </button>
      <a class="user-chip" href="#/settings" aria-label="Account settings">
        <svg class="icon" aria-hidden="true"><use href="#i-user-circle"/></svg>
        <span id="userLabel">Student</span>
        <svg class="icon chev" aria-hidden="true"><use href="#i-chevron"/></svg>
      </a>
    </div>

    <!-- Each screen is rendered into this element by script.js -->
    <main id="view" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
